[workspace]
members = [
  "crates/battle-royale-client",
  "crates/battle-royale-core",
  "crates/battle-royale-protocol",
  "crates/battle-royale-game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "043867333bbfd880d4ef3484d57fd7199d3b6f2b" }
mmorpg-core = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "6d744b799b1ab43c514cbddcf6842ae9ac8194e5" }
mmorpg-protocol = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "6d744b799b1ab43c514cbddcf6842ae9ac8194e5" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "001cd01c7f25898a1080fb7e200482bbfb8060d5" }
battle-royale-core = { path = "crates/battle-royale-core" }
battle-royale-protocol = { path = "crates/battle-royale-protocol" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
