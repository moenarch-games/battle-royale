[workspace]
members = [
  "crates/battle-royale-client",
  "crates/battle-royale-core",
  "crates/battle-royale-protocol",
  "crates/battle-royale-game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "57d338546bcbd7046aafddc23f37612a33b7ca5f" }
mmorpg-core = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "35472644ad9ac568b2941bc4480e538d009e46d6" }
mmorpg-protocol = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "35472644ad9ac568b2941bc4480e538d009e46d6" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "3b0d6698de3c8e48d612e7b73bc6956dd1da1d05" }
battle-royale-core = { path = "crates/battle-royale-core" }
battle-royale-protocol = { path = "crates/battle-royale-protocol" }
# Test-only: iterates mmorpg-core's `PlayerClass::VARIANTS`.
strum = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
