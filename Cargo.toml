[workspace]
members = [
  "crates/battle-royale-client",
  "crates/battle-royale-core",
  "crates/battle-royale-protocol",
  "crates/battle-royale-game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "769de47005cc37891011fc76ae183c18b7c5e0ae" }
mmorpg-core = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "81306faec8a6a7ea3b4279d75f763c1135ca4a19" }
mmorpg-protocol = { git = "https://github.com/moritzbrantner/mmorpg.git", rev = "81306faec8a6a7ea3b4279d75f763c1135ca4a19" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "cf0d89f0cc048cec865682926b15acb1b273e589" }
battle-royale-core = { path = "crates/battle-royale-core" }
battle-royale-protocol = { path = "crates/battle-royale-protocol" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
