<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Practice Battle Royale in the shared MMORPG fortress arena, without an account or server.">
    <title>Battle Royale · Practice Arena</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #f1f5f9; background: #0f172a; }
      body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; }
      main { box-sizing: border-box; width: min(100%, 32rem); padding: 2rem; }
      h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 1rem; }
      p { color: #cbd5e1; line-height: 1.6; }
      .play { display: block; margin: 1.75rem 0; padding: 1rem 1.25rem; border-radius: 0.65rem;
        background: #38bdf8; color: #082f49; font-weight: 700; text-align: center;
        text-decoration: none; }
      .play:hover { background: #7dd3fc; }
      .play:focus-visible { outline: 3px solid #f8fafc; outline-offset: 4px; }
      .detail { font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Battle Royale</h1>
      <p>Enter the shared MMORPG fortress. Choose your class and equipment, then fight training targets in your browser.</p>
      <a class="play" href="https://moenarch-games.github.io/mmorpg/?activity=battle-royale">Play local practice</a>
      <p class="detail">No account or server required. To play with friends, choose <strong>Hosted match</strong> in the arena setup and provide your own match server.</p>
    </main>
  </body>
</html>
